name: Deploy StaffFlow backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MY_AWS_REGION: ${{ vars.MY_AWS_REGION || 'ap-south-1' }}
      STAGE: prod
      DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_MOBILE_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID }}
      COGNITO_OAUTH_CLIENT_ID: ${{ vars.COGNITO_OAUTH_CLIENT_ID || vars.COGNITO_MOBILE_CLIENT_ID }}
      WEBSOCKET_API_ID: ${{ vars.WEBSOCKET_API_ID }}
      WEBSOCKET_API_ENDPOINT: ${{ vars.WEBSOCKET_API_ENDPOINT }}
      ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
      EXPO_ORIGIN: ${{ vars.EXPO_ORIGIN || 'http://localhost:8081' }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate AWS deployment configuration
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.MY_AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ROLE_ARN}" ]; then
            echo "::error title=Missing AWS deployment role::Add the MY_AWS_DEPLOY_ROLE_ARN secret to the production environment, and trust this repository's GitHub OIDC subject."
            exit 1
          fi
          for name in DYNAMODB_TABLE_NAME S3_BUCKET_NAME COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_MOBILE_CLIENT_ID WEBSOCKET_API_ID ADMIN_ORIGIN; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing backend variable::Add ${name} to the production environment variables."
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.MY_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.MY_AWS_REGION }}

      - name: Deploy backend
        run: bash backend/scripts/deploy-aws.sh

      - name: Verify public HTTP routes
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          set -euo pipefail
          stack_api_base_url="$(aws cloudformation describe-stacks --stack-name "staffflow-backend-${STAGE}" --region "${MY_AWS_REGION}" --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text 2>/dev/null || true)"
          if [ -n "${stack_api_base_url}" ] && [ "${stack_api_base_url}" != "None" ]; then
            API_BASE_URL="${stack_api_base_url}"
          fi
          echo "Deployed HTTP API: ${API_BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${API_BASE_URL}" ]; then
            echo "API_BASE_URL is not configured; skipping public route smoke test."
            exit 0
          fi
          API_BASE_URL="${API_BASE_URL%/}"
          curl --fail --silent --show-error "${API_BASE_URL}/health" >/dev/null
          status=$(curl --silent --output /tmp/staffflow-auth-route.json --write-out "%{http_code}" --request POST --header "content-type: application/json" --data '{}' "${API_BASE_URL}/api/auth/otp/send")
          if [ "${status}" = "404" ]; then
            cat /tmp/staffflow-auth-route.json
            echo "The deployed API is missing /api/auth/otp/send."
            exit 1
          fi
          if [ "${status}" != "400" ]; then
            cat /tmp/staffflow-auth-route.json
            echo "Unexpected status from the OTP route: ${status}"
            exit 1
          fi
