name: Build StaffFlow mobile apps

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-eas.yml"
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the completed build to the configured app stores
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.MY_AWS_REGION || 'ap-south-1' }}
      EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MOBILE_AUTO_SUBMIT: ${{ vars.MOBILE_AUTO_SUBMIT || 'false' }}
      SUBMIT_ON_DISPATCH: ${{ inputs.submit || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project configuration
        working-directory: apps/mobile
        run: |
          if [ -z "${EXPO_PROJECT_ID:-}" ]; then
            echo "EXPO_PROJECT_ID is required. Run 'eas init' once locally and save the project ID as a GitHub production variable."
            exit 1
          fi

      - name: Build mobile binaries
        working-directory: apps/mobile
        run: |
          if [ "${MOBILE_AUTO_SUBMIT:-false}" = "true" ] || [ "${SUBMIT_ON_DISPATCH:-false}" = "true" ]; then
            eas build --platform all --profile production --non-interactive --auto-submit --auto-submit-with-profile production
          else
            eas build --platform all --profile production --non-interactive --no-wait
          fi
