name: Build StaffFlow mobile apps

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-eas.yml"
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the completed build to the configured app stores
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.MY_AWS_REGION || vars.EXPO_PUBLIC_AWS_REGION || secrets.MY_AWS_REGION || secrets.EXPO_PUBLIC_AWS_REGION || 'ap-south-1' }}
      EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID || vars.EXPO_PUBLIC_COGNITO_USER_POOL_ID || secrets.COGNITO_USER_POOL_ID || secrets.EXPO_PUBLIC_COGNITO_USER_POOL_ID }}
      EXPO_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_MOBILE_CLIENT_ID || vars.EXPO_PUBLIC_COGNITO_CLIENT_ID || secrets.COGNITO_MOBILE_CLIENT_ID || secrets.EXPO_PUBLIC_COGNITO_CLIENT_ID }}
      EXPO_PUBLIC_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN || vars.EXPO_PUBLIC_COGNITO_DOMAIN || secrets.COGNITO_DOMAIN || secrets.EXPO_PUBLIC_COGNITO_DOMAIN }}
      EXPO_PUBLIC_COGNITO_OAUTH_CLIENT_ID: ${{ vars.COGNITO_OAUTH_CLIENT_ID || vars.EXPO_PUBLIC_COGNITO_OAUTH_CLIENT_ID || secrets.COGNITO_OAUTH_CLIENT_ID || secrets.EXPO_PUBLIC_COGNITO_OAUTH_CLIENT_ID || vars.COGNITO_MOBILE_CLIENT_ID || secrets.COGNITO_MOBILE_CLIENT_ID }}
      EXPO_PUBLIC_PARSE_PROVIDER: ${{ vars.EXPO_PUBLIC_PARSE_PROVIDER || secrets.EXPO_PUBLIC_PARSE_PROVIDER || 'api' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MOBILE_AUTO_SUBMIT: ${{ vars.MOBILE_AUTO_SUBMIT || 'false' }}
      SUBMIT_ON_DISPATCH: ${{ inputs.submit || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS configuration
        env:
          EAS_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EAS_TOKEN}" ]; then
            echo "::error title=Missing Expo token::Add the EXPO_TOKEN secret to the production environment. Create it from the Expo account token page."
            exit 1
          fi
          if [ -z "${EXPO_PROJECT_ID:-}" ]; then
            echo "::error title=Missing Expo project ID::Add EXPO_PROJECT_ID to the production environment variables."
            exit 1
          fi

      - name: Configure EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project configuration
        working-directory: apps/mobile
        run: |
          test "$(node -e "console.log(require('./app.json').expo.extra.eas.projectId)")" = "${EXPO_PROJECT_ID}"

      - name: Build mobile binaries
        working-directory: apps/mobile
        run: |
          if [ "${MOBILE_AUTO_SUBMIT:-false}" = "true" ] || [ "${SUBMIT_ON_DISPATCH:-false}" = "true" ]; then
            eas build --platform all --profile production --non-interactive --auto-submit --auto-submit-with-profile production
          else
            eas build --platform all --profile production --non-interactive --no-wait
          fi
